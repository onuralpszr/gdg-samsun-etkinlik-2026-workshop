site_name: No GPU Left Behind
site_description: Hybrid Ultralytics YOLO training and fast execution, a GDG Samsun DevFest 2026 workshop
site_author: Onuralp Sezer
site_url: https://onuralpszr.github.io/gdg-samsun-etkinlik-2026-workshop/
repo_url: https://github.com/onuralpszr/gdg-samsun-etkinlik-2026-workshop
repo_name: gdg-samsun-etkinlik-2026-workshop
edit_uri: edit/main/docs/
copyright: GDG Samsun DevFest 2026 workshop by Onuralp Sezer, code under AGPL 3.0

theme:
  name: material
  logo: assets/logos/gdg-mark.svg
  favicon: assets/logos/favicon.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/gdg.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/onuralpszr/gdg-samsun-etkinlik-2026-workshop
    - icon: fontawesome/solid/rocket
      link: https://platform.ultralytics.com
    - icon: fontawesome/brands/rust
      link: https://github.com/ultralytics/inference

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  assets/results/*.md

nav:
  - Workshop: index.md
