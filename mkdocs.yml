site_name: No GPU Left Behind
site_description: Hybrid Ultralytics YOLO training and fast execution, a GDG Samsun DevFest 2026 workshop
site_author: Onuralp Sezer
site_url: https://onuralpszr.github.io/gdg-samsun-etkinlik-2026-workshop/
repo_url: https://github.com/onuralpszr/gdg-samsun-etkinlik-2026-workshop
repo_name: gdg-samsun-etkinlik-2026-workshop
edit_uri: edit/main/docs/
copyright: GDG Samsun DevFest 2026 workshop by Onuralp Sezer, code under AGPL 3.0

theme:
  name: material
  language: en
  logo: assets/logos/gdg-mark.svg
  favicon: assets/logos/favicon.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: tr
          name: Türkçe
          build: true
          site_name: Hiçbir GPU Geride Kalmasın
          site_description: Hibrit Ultralytics YOLO eğitimi ve hızlı çalıştırma, GDG Samsun DevFest 2026 atölyesi
          copyright: GDG Samsun DevFest 2026 atölyesi, Onuralp Sezer, kod AGPL 3.0 lisanslı
          nav_translations:
            Home: Ana sayfa
            Step 0 Setup: Adım 0 Kurulum
            Step 1 Train: Adım 1 Eğitim
            Playground: Deneme alanı
            Step 2 Export: Adım 2 Dışa aktarma
            Step 3 Rust: Adım 3 Rust
            Wrap up: Kapanış

extra_css:
  - stylesheets/gdg.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/onuralpszr/gdg-samsun-etkinlik-2026-workshop
    - icon: fontawesome/solid/rocket
      link: https://platform.ultralytics.com
    - icon: fontawesome/brands/rust
      link: https://github.com/ultralytics/inference

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Step 0 Setup: setup.md
  - Step 1 Train: train.md
  - Playground: playground.md
  - Step 2 Export: export.md
  - Step 3 Rust: rust.md
  - Wrap up: wrap-up.md

validation:
  links:
    anchors: warn
